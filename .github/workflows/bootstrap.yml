name: Importar site Gaúchos Hair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
      - '.bootstrap/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  import-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair projeto e verificar integridade
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const zlib = require('node:zlib');
          const crypto = require('node:crypto');
          const base64 = Array.from({length: 5}, (_, i) =>
            fs.readFileSync(`.bootstrap/chunk${i + 1}.txt`, 'utf8').trim()
          ).join('');
          const checksum = crypto.createHash('sha256').update(base64).digest('hex');
          if (checksum !== 'e9d9a7e2612dbd8e5b7301a786412eaa988d1d16807788279dc3ba6d5669425a') {
            throw new Error('O pacote falhou na validação de integridade.');
          }
          fs.writeFileSync('/tmp/gauchos-site.tar', zlib.brotliDecompressSync(Buffer.from(base64, 'base64')));
          NODE
          tar -xf /tmp/gauchos-site.tar
          rm -rf .bootstrap
      - name: Salvar arquivos de origem na main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publicar projeto Gaúchos Hair Itu na raiz"
            git push origin HEAD:main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Gerar site
        env:
          VITE_BASE: /GauchosHair/
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
